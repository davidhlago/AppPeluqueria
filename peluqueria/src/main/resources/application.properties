server.port=8080

# --- BASE DE DATOS (Añadido &autoReconnect=true) ---
spring.datasource.url=jdbc:mysql://localhost:3306/serviciopeluqueria?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- ? CONFIGURACIÓN HIKARI (ESTO ES LO QUE TE FALTA) ---
# Esto mantiene vivas las conexiones y evita el error "Communications link failure"
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=true

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# Esta línea ayuda a evitar errores con objetos vacíos en JSON
spring.jackson.serialization.fail-on-empty-beans=false

